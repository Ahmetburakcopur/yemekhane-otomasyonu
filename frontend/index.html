<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kampüs Yemekhane Otomasyonu</title>
  <link rel="stylesheet" href="/css/temel.css" />
</head>
<body>
  <header class="ust-cubuk">
    <div class="kap ust-ic">
      <div class="marka">Kampüs Yemekhane</div>
      <div id="kullanici-bilgi" class="kullanici-bilgi"></div>
    </div>
    <nav class="kap menu-cubugu" id="ana-nav">
      <button data-sekme="gunun" class="aktif">Günün Menüsü</button>
      <button data-sekme="haftalik">Haftalık &amp; Rezervasyon</button>
      <button data-sekme="rezervasyonlar" class="giris-gerekli gizli">Rezervasyonlarım</button>
      <button data-sekme="bakiye" class="giris-gerekli gizli">Bakiye</button>
      <button data-sekme="yonetici" class="yonetici-gerekli gizli">Yönetici</button>
      <button data-sekme="giris" id="btn-giris-sekme">Giriş Yap</button>
      <button id="btn-cikis" class="giris-gerekli gizli">Çıkış</button>
    </nav>
  </header>

  <main class="kap">
    <div id="bildirim" class="bildirim gizli"></div>

    <!-- 1. GİRİŞ EKRANI -->
    <section id="sekme-giris" class="panel gizli">
      <h2>Giriş Yap</h2>
      <form id="form-giris" class="form-kutu">
        <label>E-posta
          <input type="email" id="giris-eposta" required placeholder="ornek@uni.edu.tr" />
        </label>
        <label>Şifre
          <input type="password" id="giris-sifre" required placeholder="••••••••" />
        </label>
        <button type="submit" class="btn-birincil">Giriş Yap</button>
      </form>
    </section>

    <!-- 2. GÜNÜN MENÜSÜ -->
    <section id="sekme-gunun" class="panel">
      <h2>Günün Menüsü</h2>
      <div class="filtre-satir">
        <select id="gunun-yemekhane"></select>
        <select id="gunun-ogun"></select>
        <input type="date" id="gunun-tarih" />
        <button id="btn-gunun-getir" class="btn-birincil">Göster</button>
      </div>
      <div id="gunun-icerik"></div>
    </section>

    <!-- 3. HAFTALIK MENÜ VE REZERVASYON -->
    <section id="sekme-haftalik" class="panel gizli">
      <h2>Haftalık Menü ve Rezervasyon</h2>
      <div class="filtre-satir">
        <select id="haftalik-yemekhane"></select>
        <input type="date" id="haftalik-baslangic" />
        <button id="btn-haftalik-getir" class="btn-birincil">Listele</button>
      </div>
      <div id="haftalik-icerik" class="kart-izgara"></div>
    </section>

    <!-- 4. REZERVASYONLARIM VE DEĞERLENDİRME -->
    <section id="sekme-rezervasyonlar" class="panel gizli">
      <h2>Rezervasyonlarım</h2>
      <div id="rezervasyonlar-icerik"></div>
    </section>

    <!-- 5. BAKİYE -->
    <section id="sekme-bakiye" class="panel gizli">
      <h2>Bakiye İşlemleri</h2>
      <div class="bakiye-ozet">
        <div>Güncel Bakiye: <strong id="bakiye-tutar">0.00 TL</strong></div>
        <form id="form-bakiye" class="filtre-satir">
          <input type="number" id="yukleme-tutar" min="10" max="1000" step="1" placeholder="Tutar (10-1000 TL)" required />
          <button type="submit" class="btn-birincil">Bakiye Yükle</button>
        </form>
      </div>
      <h3>Hareket Geçmişi</h3>
      <div id="bakiye-hareketler"></div>
    </section>

    <!-- 7. YÖNETİCİ PANELİ -->
    <section id="sekme-yonetici" class="panel gizli">
      <h2>Yönetici Paneli</h2>
      <form id="form-menu-kaydet" class="form-kutu">
        <h3>Menü Oluştur / Düzenle</h3>
        <div class="filtre-satir">
          <select id="yon-yemekhane" required></select>
          <select id="yon-ogun" required></select>
          <input type="date" id="yon-tarih" required />
        </div>
        <div class="filtre-satir">
          <input type="number" id="yon-ogr-fiyat" step="0.5" min="0" placeholder="Öğrenci Fiyatı (TL)" required />
          <input type="number" id="yon-per-fiyat" step="0.5" min="0" placeholder="Personel Fiyatı (TL)" required />
        </div>
        <div class="yemek-secim-baslik">Yemekleri Seçin:</div>
        <div id="yon-yemekler" class="yemek-secim-liste"></div>
        <button type="submit" class="btn-birincil">Menüyü Kaydet</button>
      </form>

      <h3>Menü Doluluk ve Puan Raporu</h3>
      <div id="yon-rapor" class="tablo-kap"></div>
    </section>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
